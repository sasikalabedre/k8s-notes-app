apiVersion: batch/v1
kind: Job
metadata:
  name: notes-db-init
  namespace: notes-app
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: postgres:16
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: notes-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: notes-config
              key: POSTGRES_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: notes-secret
              key: POSTGRES_PASSWORD
        command: ["sh", "-c"]
        args:
        - |
          until pg_isready -h notes-db -U $POSTGRES_USER; do echo waiting for db; sleep 2; done
          psql -h notes-db -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE TABLE IF NOT EXISTS notes (id SERIAL PRIMARY KEY, text TEXT NOT NULL);"
