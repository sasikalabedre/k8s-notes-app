apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logger
  namespace: notes-app
spec:
  selector:
    matchLabels:
      app: node-logger
  template:
    metadata:
      labels:
        app: node-logger
    spec:
      containers:
      - name: logger
        image: busybox:1.36
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command: ["sh", "-c"]
        args:
        - |
          while true; do echo "collecting logs on node $NODE_NAME at $(date)"; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 32Mi
