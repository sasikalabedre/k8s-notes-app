apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-web
  namespace: notes-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: notes-web
  template:
    metadata:
      labels:
        app: notes-web
    spec:
      containers:
      - name: web
        image: nginx:1.25
        ports:
        - containerPort: 80
        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: notes-config
              key: APP_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: notes-config
              key: LOG_LEVEL
        volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html
        startupProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 3
          failureThreshold: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: page
        configMap:
          name: notes-config
          items:
          - key: index.html
            path: index.html
